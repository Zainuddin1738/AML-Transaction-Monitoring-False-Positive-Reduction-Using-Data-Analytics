<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AML Transaction Monitoring — Analysis Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {

      extend: {

          bricklight: '#FCE7EC',
          teal: '#0F766E',
          teallight: '#E6F5F3',
          line: '#CBD5E1',
          hallammaroon: '#672146',
        },
        fontFamily: {
          serif: ['"IBM Plex Serif"', 'serif'],
          sans: ['"IBM Plex Sans"', 'sans-serif'],
        },
      }
    }
  }
</script>
<style>
  body { font-family: 'IBM Plex Sans', sans-serif; background: #F8FAFC; }
  .tabular { font-variant-numeric: tabular-nums; }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #F1F5F9; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 0px; }
  .bar-track { background: #EEF2F7; }
</style>
</head>
<body class="text-ink">
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ============== DATA (real project findings) ============== */

const RULE_FIRES = [
  { label: "high_value (>$10,000 CTR)", value: 1369964, caught: 2004, hitRate: 0.1463 },
  { label: "high_velocity (≥10/24h)", value: 1231906, caught: 945, hitRate: 0.0767 },
  { label: "high_risk_format (ACH)", value: 599689, caught: 3828, hitRate: 0.6383 },
  { label: "structuring ($9k–$10k)", value: 51149, caught: 123, hitRate: 0.2405 },
  { label: "round_amount", value: 68, caught: 0, hitRate: 0.0 },
];

const FORMAT_RATES = [
  { label: "ACH", value: 0.6383, flag: true },
  { label: "Bitcoin", value: 0.0383, flag: false },
  { label: "Cash", value: 0.022, flag: false },
  { label: "Cheque", value: 0.0174, flag: false },
  { label: "Credit Card", value: 0.0156, flag: false },
  { label: "Wire", value: 0.0, flag: false },
  { label: "Reinvestment", value: 0.0, flag: false },
];
const OVERALL_RATE = 4522/5077237*100;

const FEATURE_IMPORTANCE = [
  { label: "is_ach", value: 0.8013 },
  { label: "is_self_transaction", value: 0.0454 },
  { label: "currency_mismatch", value: 0.0306 },
  { label: "is_bitcoin", value: 0.0188 },
  { label: "fmt_Wire", value: 0.0183 },
  { label: "amount_paid", value: 0.0165 },
  { label: "fmt_Cheque", value: 0.0112 },
  { label: "fmt_Credit Card", value: 0.0087 },
];

const SHAP_IMPORTANCE = [
  { label: "is_ach", value: 1.2582 },
  { label: "amount_paid", value: 0.3476 },
  { label: "is_self_transaction", value: 0.1299 },
  { label: "day_of_week_num", value: 0.0942 },
  { label: "fmt_Wire", value: 0.0715 },
  { label: "currency_mismatch", value: 0.0470 },
  { label: "hour", value: 0.0295 },
  { label: "is_bitcoin", value: 0.0196 },
];

const TIMELINE = [
  {
    stage: "Rule Baseline",
    problem: "Percentile-calibrated “high value” threshold, meant to adapt to the data",
    outcome: "Threshold collapsed to $13.5M — recall fell to 4.7%",
    fix: "Reverted to the real $10,000 CTR regulatory threshold",
  },
  {
    stage: "Data Cleaning",
    problem: "A 200K-row sample had 8x fewer laundering cases than expected",
    outcome: "Full temporal check found a volume-collapse artifact after day 10",
    fix: "Modelling restricted to the stable 1–10 September window",
  },
  {
    stage: "ML Model",
    problem: "Validation set passed to training but early stopping never activated",
    outcome: "Model overtrained; an inflated “41x fewer alerts” result was reported",
    fix: "Fixed early_stopping_rounds — PR-AUC nearly tripled (0.029 → 0.083)",
  },
  {
    stage: "SHAP Analysis",
    problem: "Random 50K-row sample captured only 69 of 906 laundering cases",
    outcome: "Too few non-ACH cases to test the amount-suppression hypothesis",
    fix: "Re-sampled with guaranteed inclusion of all 906 laundering cases",
  },
];

/* ============== COMPONENTS ============== */

const Tab = ({ active, label, onClick }) => (
  <button
    onClick={onClick}
    className={`px-4 py-2.5 text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${
      active ? "border-navy text-navy" : "border-transparent text-slate-500 hover:text-ink"
    }`}
  >{label}</button>
);

const SectionHeader = ({ eyebrow, title, description }) => (
  <div className="mb-6 max-w-2xl">
    <p className="text-xs font-semibold text-navy mb-1">{eyebrow}</p>
    <h2 className="font-serif text-2xl text-ink mb-2">{title}</h2>
    {description && <p className="text-sm text-slate-600 leading-relaxed">{description}</p>}
  </div>
);

const Stat = ({ value, label, sub, color = "text-ink" }) => (
  <div className="border border-line bg-white px-5 py-4">
    <div className={`font-serif text-3xl tabular ${color}`}>{value}</div>
    <div className="text-sm font-medium text-slate-700 mt-1">{label}</div>
    {sub && <div className="text-xs text-slate-500 mt-1">{sub}</div>}
  </div>
);

const HBar = ({ label, value, max, display, color = "bg-navy", note }) => (
  <div className="mb-3.5">
    <div className="flex justify-between items-baseline text-sm mb-1">
      <span className="text-slate-700">{label}</span>
      <span className="tabular font-medium text-ink">{display}</span>
    </div>
    <div className="w-full bar-track h-2.5">
      <div className={`${color} h-2.5`} style={{ width: `${Math.max(Math.min((value/max)*100,100),0.4)}%` }}></div>
    </div>
    {note && <div className="text-xs text-slate-500 mt-1">{note}</div>}
  </div>
);

const StackedBar = ({ label, fp, fn, total, fpLabel, fnLabel }) => {
  const fpPct = (fp/total)*100, fnPct = (fn/total)*100;
  return (
    <div className="mb-4">
      <div className="flex justify-between items-baseline text-sm mb-1">
        <span className="text-slate-700">{label}</span>
        <span className="tabular font-medium text-ink">${(total/1e6).toFixed(2)}M</span>
      </div>
      <div className="w-full h-6 flex bar-track overflow-hidden">
        <div className="bg-brick h-full flex items-center" style={{width: `${fpPct}%`}}></div>
        <div className="bg-teal h-full flex items-center" style={{width: `${fnPct}%`}}></div>
      </div>
      <div className="flex justify-between text-xs text-slate-500 mt-1">
        <span>{fpLabel}: ${(fp/1e6).toFixed(2)}M</span>
        <span>{fnLabel}: ${(fn/1e6).toFixed(2)}M</span>
      </div>
    </div>
  );
};

const Callout = ({ title, children, tone = "navy" }) => {
  const tones = {
    navy: "border-navy bg-slate-50",
    brick: "border-brick bg-bricklight",
    teal: "border-teal bg-teallight",
  };
  return (
    <div className={`border-l-2 ${tones[tone]} pl-4 py-3 pr-4`}>
      {title && <div className="text-sm font-semibold text-ink mb-1">{title}</div>}
      <div className="text-sm text-slate-700 leading-relaxed">{children}</div>
    </div>
  );
};

const Table = ({ headers, rows }) => (
  <table className="w-full text-sm">
    <thead>
      <tr className="border-b border-ink">
        {headers.map((h,i) => <th key={i} className="text-left font-medium text-slate-600 pb-2 pr-4">{h}</th>)}
      </tr>
    </thead>
    <tbody>
      {rows.map((r,i) => (
        <tr key={i} className="border-b border-line">
          {r.map((c,j) => <td key={j} className="py-2 pr-4 tabular text-slate-700">{c}</td>)}
        </tr>
      ))}
    </tbody>
  </table>
);

/* ============== TABS ============== */

const OverviewTab = () => (
  <div className="fade-in">
    <SectionHeader eyebrow="Research Question" title="Can cost-sensitive ML reduce AML false positives without losing detection?"
      description="Evaluated against a rule-based baseline reflecting real industry alert logic, on the IBM AMLworld HI-Small dataset (5.08M transactions, verified against published statistics)." />

    <div className="border border-line bg-white p-6 mb-8">
      <div className="flex items-end gap-3 mb-2">
        <span className="font-serif text-5xl text-brick tabular">51.4%</span>
        <span className="text-2xl text-slate-400 mb-1">→</span>
        <span className="font-serif text-5xl text-teal tabular">8.3%</span>
      </div>
      <p className="text-sm text-slate-600">Alert rate, rule baseline vs. ML at default threshold — roughly <strong>5.2x fewer alerts</strong>, for a recall cost of 3.5 percentage points (90.7% → 87.2%).</p>
    </div>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <Stat value="90.7%" label="Baseline recall" sub="51.4% alert rate" />
      <Stat value="0.083" label="ML PR-AUC" sub="≈24x random baseline" color="text-navy" />
      <Stat value="1.51–1.62x" label="Cost reduction" sub="real transaction amounts" color="text-teal" />
      <Stat value="5.93x" label="XGBoost vs. Logistic Reg." sub="PR-AUC ratio" color="text-navy" />
    </div>

    <Callout title="The honest headline" tone="navy">
      The alert-volume story (~5.2x fewer alerts) and the cost-based story (1.5–1.6x cheaper) tell different
      magnitudes — deliberately reported both, rather than the more flattering number alone. SHAP explains why:
      the model's misses skew toward larger, non-ACH-format transactions. See the SHAP tab.
    </Callout>
  </div>
);

const BaselineTab = () => (
  <div className="fade-in">
    <SectionHeader eyebrow="Objective 3" title="Rule-Based Baseline"
      description="Five rules, OR-combined — industry-realistic AML alert logic, evaluated on 5,077,237 transactions (4,522 laundering cases) in the validated stable window." />

    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <Stat value="51.4%" label="Alert rate" />
      <Stat value="90.7%" label="Recall" />
      <Stat value="0.16%" label="Precision" />
      <Stat value="636" label="Alerts per catch" />
    </div>

    <div className="grid md:grid-cols-2 gap-10">
      <div>
        <h3 className="font-serif text-lg mb-3">Rule firing frequency</h3>
        {RULE_FIRES.map((r,i) => (
          <HBar key={i} label={r.label} value={r.value} max={1369964}
            display={r.value.toLocaleString()}
            color={r.label.includes("ACH") ? "bg-teal" : "bg-navy"}
            note={`caught ${r.caught.toLocaleString()} · hit rate ${r.hitRate.toFixed(2)}%`} />
        ))}
      </div>
      <div>
        <h3 className="font-serif text-lg mb-3">Laundering rate by payment format</h3>
        <p className="text-xs text-slate-500 mb-3">Dataset average: {OVERALL_RATE.toFixed(3)}% — for comparison against each bar below</p>
        {FORMAT_RATES.map((f,i) => (
          <HBar key={i} label={f.label} value={f.value} max={0.7}
            display={`${f.value.toFixed(3)}%`}
            color={f.flag ? "bg-brick" : "bg-slate-400"} />
        ))}
        <Callout title="Conventional wisdom, inverted" tone="brick">
          ACH — not Bitcoin or Cash — is the dominant risk signal in this dataset, at ~7x the average rate.
          Bitcoin and Cash both sit <em>below</em> average.
        </Callout>
      </div>
    </div>

    <div className="mt-10">
      <h3 className="font-serif text-lg mb-3">Single rule vs. combined ruleset</h3>
      <Table
        headers={["", "Alerts", "Caught", "Recall", "Precision"]}
        rows={[
          ["ACH rule alone", "599,689", "3,828 / 4,522", "84.65%", "0.64%"],
          ["All 5 rules combined", "2,607,758", "4,102 / 4,522", "90.71%", "0.16%"],
        ]}
      />
      <p className="text-xs text-slate-500 mt-2">Stacking four more rules on top of ACH adds 6 points of recall at 4x the false-positive cost — a quantified illustration of real-world AML alert fatigue.</p>
    </div>
  </div>
);

const ModelTab = () => (
  <div className="fade-in">
    <SectionHeader eyebrow="Objective 4" title="Cost-Sensitive ML Classifier(s)"
      description="XGBoost (scale_pos_weight, early stopping) plus a Logistic Regression comparison model, on a 70/15/15 temporal split." />

    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <Stat value="0.083" label="PR-AUC (XGBoost)" />
      <Stat value="23/300" label="Best iteration" sub="early stopping active" />
      <Stat value="-0.003" label="Overfit gap" sub="test ≥ train F1" color="text-teal" />
      <Stat value="5.93x" label="vs. Logistic Regression" sub="PR-AUC ratio" />
    </div>

    <div className="grid md:grid-cols-2 gap-10">
      <div>
        <h3 className="font-serif text-lg mb-3">Alerts vs. recall by operating point</h3>
        <HBar label="Rule baseline" value={2607758} max={2607758} display="2,607,758 alerts" color="bg-slate-400" note="90.7% recall" />
        <HBar label="ML — default threshold" value={499347} max={2607758} display="≈499,347 alerts" color="bg-teal" note="87.2% recall" />
        <HBar label="ML — matched recall" value={1272985} max={2607758} display="1,272,985 alerts" color="bg-navy" note="90.7% recall (matched)" />
      </div>
      <div>
        <h3 className="font-serif text-lg mb-3">XGBoost feature importance</h3>
        {FEATURE_IMPORTANCE.map((f,i) => (
          <HBar key={i} label={f.label} value={f.value} max={0.8013} display={f.value.toFixed(4)}
            color={f.label === "is_ach" ? "bg-brick" : "bg-navy"} />
        ))}
      </div>
    </div>

    <div className="mt-10">
      <Callout title="A corrected result, kept visible" tone="navy">
        An earlier version of this model, trained without early stopping active, appeared to achieve a
        dramatic ~41x reduction in alerts. That version was overfit — fixing the bug revealed the true
        best iteration was 23 of 300, and PR-AUC nearly tripled (0.029 → 0.083) once the model stopped
        overtraining. The corrected result above is smaller, but properly validated.
      </Callout>
    </div>
  </div>
);

const CostTab = () => (
  <div className="fade-in">
    <SectionHeader eyebrow="Objective 6" title="Cost-Based Evaluation"
      description="False-positive cost: $30/alert review (illustrative). False-negative cost: the real Amount Paid of each missed transaction — not a flat estimate." />

    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <Stat value="$9.54M" label="Rule baseline cost" />
      <Stat value="$6.33M" label="ML, default threshold" color="text-teal" />
      <Stat value="$5.90M" label="ML, cost-optimal (t=0.68)" color="text-teal" />
      <Stat value="24x" label="Cost per miss, ML vs. baseline" color="text-brick" />
    </div>

    <h3 className="font-serif text-lg mb-3">Cost composition</h3>
    <StackedBar label="Rule baseline" fp={9424860} fn={117196} total={9542056} fpLabel="False-positive cost" fnLabel="False-negative cost" />
    <StackedBar label="ML — default threshold" fp={2223360} fn={4102961} total={6326321} fpLabel="False-positive cost" fnLabel="False-negative cost" />
    <StackedBar label="ML — cost-optimal" fp={1795890} fn={4109069} total={5904959} fpLabel="False-positive cost" fnLabel="False-negative cost" />

    <div className="mt-8 grid md:grid-cols-2 gap-6">
      <Callout title="Why cost tells a different story than alert volume" tone="navy">
        The rule baseline's cost is 99% false-positive-driven (alert fatigue). ML's cost is 65%
        false-negative-driven (missed laundering value) — a different risk profile, not a smaller
        version of the same one.
      </Callout>
      <Callout title="Average cost per missed case" tone="brick">
        Rule baseline: ~$1,447 per miss (81 cases). ML: ~$35,371 per miss (116 cases) — about 24x higher.
        ML trades many small missed cases for fewer, much larger ones.
      </Callout>
    </div>
  </div>
);

const ShapTab = () => (
  <div className="fade-in">
    <SectionHeader eyebrow="Objective 5" title="SHAP Explainability"
      description="TreeExplainer on the corrected XGBoost model, sampled with all 906 test-set laundering cases guaranteed included." />

    <div className="grid md:grid-cols-2 gap-8 mb-10">
